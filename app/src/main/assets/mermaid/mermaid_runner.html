<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="file:///android_asset/mermaid/mermaid.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 12px;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #container {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    svg {
      max-width: 100% !important;
      height: auto !important;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    function renderMermaid(hash, rawCode, isDark) {
      try {
        mermaid.initialize({
          startOnLoad: false,
          securityLevel: 'strict',
          theme: isDark ? 'dark' : 'default'
        });
        const container = document.getElementById('container');
        container.innerHTML = '';
        const id = 'diagram_' + Math.abs(parseInt(hash, 10) || 1);
        mermaid.render(id, rawCode).then(function(res) {
          container.innerHTML = res.svg;
          // Notify Android of success
          setTimeout(function() {
            const height = document.body.scrollHeight || 150;
            if (window.AndroidBridge && window.AndroidBridge.onRenderSuccess) {
              window.AndroidBridge.onRenderSuccess(hash, res.svg, height);
            }
          }, 30);
        }).catch(function(err) {
          const msg = err ? (err.message || err.str || String(err)) : 'Syntax error in Mermaid diagram';
          if (window.AndroidBridge && window.AndroidBridge.onRenderError) {
            window.AndroidBridge.onRenderError(hash, msg);
          }
        });
      } catch (e) {
        const msg = e ? (e.message || String(e)) : 'Failed to initialize Mermaid';
        if (window.AndroidBridge && window.AndroidBridge.onRenderError) {
          window.AndroidBridge.onRenderError(hash, msg);
        }
      }
    }
  </script>
</body>
</html>
