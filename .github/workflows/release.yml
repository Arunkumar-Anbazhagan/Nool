name: Release APKs

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag and Changelog
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            DATE_STR=$(date +'%Y.%m.%d')
            TAG_NAME="v${DATE_STR}-build.${{ github.run_number }}"
            echo "Push to branch detected. Creating release tag: $TAG_NAME"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG_NAME" -m "Automated release $TAG_NAME on push"
            git push origin "$TAG_NAME" || echo "Tag push skipped or already exists"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Generate changelog from commit messages
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG_NAME"^ 2>/dev/null || "")
          echo "### Changes in this Release" > /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          if [ -n "$PREV_TAG" ]; then
            echo "Commits since previous tag ($PREV_TAG):" >> /tmp/release_notes.md
            git log "$PREV_TAG"..HEAD --pretty=format:"* %s (%h) - @%an" >> /tmp/release_notes.md
          else
            echo "Recent commit history:" >> /tmp/release_notes.md
            git log -n 15 --pretty=format:"* %s (%h) - @%an" >> /tmp/release_notes.md
          fi
          echo "" >> /tmp/release_notes.md

      - name: Set up Signing Keystore
        run: |
          if [ -n "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from secrets..."
            echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
            echo "KEYSTORE_FILE=/tmp/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating self-signed release keystore for CI..."
            mkdir -p /tmp/keystore
            keytool -genkeypair -v \
              -keystore /tmp/keystore/ci-release.keystore \
              -alias ci-key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Nool CI, OU=Engineering, O=Nool, L=Global, S=Global, C=US"
            echo "KEYSTORE_FILE=/tmp/keystore/ci-release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=ci-key" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build Release APKs
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify Generated APKs
        run: |
          echo "Listing release APKs:"
          ls -la androidApp/build/outputs/apk/release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: "Nool ${{ steps.release_meta.outputs.tag_name }}"
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            androidApp/build/outputs/apk/release/app-arm64-v8a-release.apk
            androidApp/build/outputs/apk/release/app-armeabi-v7a-release.apk
            androidApp/build/outputs/apk/release/app-universal-release.apk

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nool-release-apks
          path: androidApp/build/outputs/apk/release/*.apk
